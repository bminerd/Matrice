# /.gitlab-ci.yml

image: bminerd/plat4m_linux_dev:2.0.0

variables:
  DOCKER_TLS_CERTDIR: ""
  GIT_SUBMODULE_STRATEGY: normal

stages:
  - build
  - test

build:Matrice_Test_App:
  stage: build
  tags:
    - docker
  script:
  - Tests/Matrice_Test_App/build.sh
  artifacts:
    paths:
      - Tests/Matrice_Test_App/Build/

test:Matrice_Test_App:
  stage: test
  tags:
    - docker
  script:
  - Tests/Matrice_Test_App/test.sh
  dependencies:
    - build:Matrice_Test_App
